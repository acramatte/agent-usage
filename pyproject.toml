[project]
name = "agent-usage"
version = "0.1.0"
description = "Skills, tool calls and model usage across local coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
push = ["huggingface_hub>=0.25"]

[project.scripts]
agent-usage = "agent_usage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_usage"]
